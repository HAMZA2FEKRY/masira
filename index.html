<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسيرتي اليومية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f8f4e8;--card:#fffdf6;--tx:#26342d;--mu:#7a7f6c;--ac:#2f6f57;--ac2:#e7efdd;--bd:#e9e1c9;--wa:#b9852a;--dg:#b5503f;--hl:#fff1cc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1c241f;--tx:#ebe7da;--mu:#9aa592;--ac:#5fb590;--ac2:#26372d;--bd:#2d3a31;--wa:#d9a954;--dg:#e0806f;--hl:#3a3320}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1c241f;--tx:#ebe7da;--mu:#9aa592;--ac:#5fb590;--ac2:#26372d;--bd:#2d3a31;--wa:#d9a954;--dg:#e0806f;--hl:#3a3320}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.55;padding-bottom:84px}
.w{max-width:680px;margin:0 auto;padding:12px 14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:21px;margin:0;color:var(--ac)}
.nav{display:flex;gap:6px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 12px;min-height:38px}
button:active{transform:scale(.95)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.big{width:100%;min-height:52px;font-size:18px;margin-top:10px}
button.on{background:var(--ac2);border-color:var(--ac)}
.sm{font-size:12px;padding:0 8px;min-height:28px;border-radius:8px}
.dg{color:var(--dg)}
.mu,small{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{display:flex;align-items:center;gap:16px}
.rw{position:relative;flex:none}.rw svg{width:100%;height:100%}
.rb{fill:none;stroke:var(--ac2);stroke-width:11}
.rg{fill:none;stroke:var(--ac);stroke-width:11;stroke-linecap:round;stroke-dasharray:326.7;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.rt b{font-size:24px}.rt small{font-size:11px}
.nx{flex:1;min-width:0}.nt{font-size:19px;font-weight:700;margin:2px 0}
.sh{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0 8px}
.sh b{flex:1;font-size:17px}.ar{color:var(--ac);width:16px}
.chip{background:var(--ac2);color:var(--ac);border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600}
.full .chip{background:var(--ac);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--ac2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.g{margin-top:12px}
.g h3{font-size:14px;margin:0 0 4px;color:var(--ac);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.t{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:12px;margin:2px 0;border:1px solid transparent}
.t.pr{background:var(--hl);border-color:var(--wa)}
.t.lt{border-color:var(--dg)}
.ck{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ac);flex:none;display:grid;place-items:center;padding:0;color:#fff;font-size:18px;background:transparent}
.ck.d{background:var(--ac)}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.x{flex:1}.t.dn .x{text-decoration:line-through;color:var(--mu)}
.tag{background:var(--dg);color:#fff;font-size:11px;border-radius:8px;padding:0 7px}
.st{font-size:12px;color:var(--wa);white-space:nowrap}
.star{border:0;background:none;font-size:20px;padding:0 4px;min-height:30px;color:var(--bd)}
.star.on{color:var(--wa)}
textarea,input{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px}
textarea{min-height:60px;resize:vertical;margin-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.c{justify-content:center}
.tm{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac);line-height:1.1}
.ses{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd);align-items:center}.ses span{flex:1}
.cols{display:flex;gap:6px;align-items:flex-end;margin-top:10px}
.col{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center}
.col b{font-size:12px}.col.cur b{color:var(--ac)}
.cb{width:100%;height:120px;background:var(--ac2);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.cb i{display:block;width:100%;background:var(--ac);transition:height .6s}
.col.cur .cb{outline:2px solid var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tiles div{background:var(--ac2);border-radius:14px;padding:8px;text-align:center}.tiles b{display:block;font-size:20px;color:var(--ac)}
.sb{display:flex;gap:8px;align-items:center;margin:8px 0}.sb span{width:110px;font-size:13px}.sb .bar{flex:1}.sb em{width:38px;font-style:normal;font-size:12px}
.jg{display:grid}
.jg aside{order:-1}
.qc{border-right:4px solid var(--ac);background:linear-gradient(135deg,var(--card),var(--ac2))}
.qf{font-size:19px;font-weight:700;color:var(--ac);margin:4px 0;cursor:pointer;line-height:1.6;animation:in .4s both}
.ql{display:none;margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}.ql.ed{display:block}
.qi{display:flex;gap:6px;align-items:center;padding:5px 0;font-size:14px;color:var(--mu)}.qi span{flex:1}.qi.a{color:var(--tx);font-weight:600}
@media(min-width:860px){.w{max-width:1000px}.jg{grid-template-columns:1fr 310px;gap:14px;align-items:start}.jg aside{order:0;position:sticky;top:12px}.ql{display:block}}
#nv{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;z-index:10}
#nv button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1.2;padding:4px;color:var(--mu)}
#nv button span{font-size:20px}#nv button.on{color:var(--ac);background:var(--ac2);font-weight:700}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#md .bx{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:420px}
.cf{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.7s ease-in forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:.7}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
  <div class="hd">
    <h1>🌿 مسيرتي</h1>
    <div class="nav">
      <span id="dn" class="nav"><button data-a="next">›</button><button data-a="today" id="dl"></button><button data-a="prev">‹</button></span>
      <button data-a="snd" id="sb"></button><button data-a="edit" id="eb">✎</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<nav id="nv">
  <button data-a="pg" data-p="j"><span>🌱</span>المسيرة</button>
  <button data-a="pg" data-p="w"><span>⏱</span>العمل</button>
  <button data-a="pg" data-p="s"><span>📊</span>الإحصائيات</button>
</nav>
<div id="md"><div class="bx"><h3 id="mt" style="margin:0 0 8px"></h3><div id="mb"></div><div class="row"><button class="p" id="ok">حسناً</button><button id="no">إلغاء</button></div></div></div>

<script>
var KEY="masira_v1",D,cur,edit=false,pg="j",off=0,prev={},pop=null,ac=null;
var BY={g1:12,g2:16,g3:18,g4:20,g5:24};
function uid(){return Math.random().toString(36).slice(2,8)}
function T(id,t){return{id:id,t:t}}
function defaults(){return{target:[180,360],timer:null,log:{},snd:true,mode:"free",open:{},sections:[
 {id:"s1",name:"المسيرة الذاتية",type:"list",groups:[
  {id:"g1",by:12,name:"1️⃣ الصبح",tasks:[T("a1","النظر في جدول اليوم"),T("a2","قراءة آية قرآنية بتدبر"),T("a3","بدء شغل الـ freelancing"),T("a4","تعلّم كورس في المجال")]},
  {id:"g2",by:16,name:"2️⃣ الظهر",tasks:[T("a5","إكمال الشغل"),T("a6","إنجليزي بشكل جديد (دقيقة)")]},
  {id:"g3",by:18,name:"3️⃣ العصر",tasks:[T("a7","قراءة ثقافية"),T("a8","تمكين معرفي: قراءة سطر أو استماع لدقيقة")]},
  {id:"g4",by:20,name:"4️⃣ المغرب",tasks:[T("a9","بداية تنفيذ مهام المسيرة")]},
  {id:"g5",by:24,name:"5️⃣ العشاء",tasks:[T("b1","وقت الأهل والاجتماعيات"),T("b2","شكر الله قبل النوم، صلاة المحبة لأحد أسيادنا، الاستغفار الكبير للسابقين"),T("b3","الصلاة على الحبيب ﷺ 10 مرات بحضور")]}]},
 {id:"s2",name:"المسيرة الجماعية",type:"list",groups:[{id:"g6",by:24,name:"متابعة",tasks:[T("c1","متابعة ملفات التواصل"),T("c2","متابعة ملفات الإعداد"),T("c3","متابعة الشباب")]}]}]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}
 if(!D||!D.sections)D=defaults();
 D.sections=D.sections.filter(function(s){return s.type!=="work"});
 D.sections.forEach(function(s){s.groups.forEach(function(g){if(g.by==null&&BY[g.id]!=null)g.by=BY[g.id]})});
 D.q=D.q&&D.q.length?D.q:QS.slice();D.snd=D.snd!==false;D.mode=D.mode||"free";D.open=D.open||{};D.log=D.log||{};D.target=D.target||[180,360];
 if(D.timer&&!D.timer.mode)D.timer.mode="free"}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function ds(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ds(d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function L(d){if(!D.log[d])D.log[d]={d:{},w:0,n:{},s:[]};return D.log[d]}
function sec(id){return D.sections.filter(function(s){return s.id===id})[0]}
function findG(id){var r;D.sections.forEach(function(s){s.groups.forEach(function(g){if(g.id===id)r={s:s,g:g}})});return r}
function findT(id){var r;D.sections.forEach(function(s){s.groups.forEach(function(g){g.tasks.forEach(function(k){if(k.id===id)r={s:s,g:g,k:k}})})});return r}
function cnt(s,d){var l=D.log[d],n=0,t=0;s.groups.forEach(function(g){g.tasks.forEach(function(k){t++;if(l&&l.d[k.id])n++})});return[n,t]}
function dayCnt(d){var n=0,t=0;D.sections.forEach(function(s){var c=cnt(s,d);n+=c[0];t+=c[1]});return[n,t]}
function pct(d){var c=dayCnt(d);return c[1]?Math.round(c[0]/c[1]*100):0}
function late(g){var h=new Date().getHours();return cur===ds(new Date())&&g.by>0&&g.by<24&&h>=g.by}
function streak(id){var d=cur,n=0;if(!(D.log[d]&&D.log[d].d[id]))d=addDays(d,-1);while(D.log[d]&&D.log[d].d[id]){n++;d=addDays(d,-1)}return n}
function pad(n){return n<10?"0"+n:n}
function fmt(m){return Math.floor(m/60)+":"+pad(m%60)}
function fmtS(s){s=Math.max(0,s);return Math.floor(s/60)+":"+pad(s%60)}

/* sound + confetti */
function snd(k){if(!D.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
 var N={tick:[660,880],done:[523,659,784,1047],win:[523,659,784,1047,1319],chime:[784,659,784,988],undo:[330]}[k],t=ac.currentTime;
 N.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  var s=t+i*.11;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.16,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.35);o.start(s);o.stop(s+.4)})}catch(e){}}
function boom(n){var C=["#2f6f57","#b9852a","#d9c9a3","#5fb590","#e0a73c","#8fb996"];
 for(var i=0;i<(n||30);i++){var e=document.createElement("div");e.className="cf";e.style.left=Math.random()*100+"vw";e.style.background=C[i%C.length];e.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(e);setTimeout(function(x){x.remove()},2400,e)}}

/* views */
function ring(id,p,big,sub,sz,bid){var C=326.7,from=prev[id]!=null?prev[id]:0;prev[id]=p;
 return '<div class="rw" style="width:'+sz+'px;height:'+sz+'px"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rb"/><circle cx="60" cy="60" r="52" class="rg" data-o="'+(C*(1-p/100))+'" style="stroke-dashoffset:'+(C*(1-from/100))+'" transform="rotate(-90 60 60)"/></svg><div class="rt"><b'+(bid?' id="'+bid+'"':'')+'>'+big+'</b><small>'+sub+'</small></div></div>'}
function nextTask(){var best=null,bs=-1,l=L(cur);D.sections.forEach(function(s){s.groups.forEach(function(g){g.tasks.forEach(function(k){if(l.d[k.id])return;var sc=(k.pr?2:0)+(late(g)?1:0);if(sc>bs){bs=sc;best={k:k,g:g}}})})});return best}
function jH(){var c=dayCnt(cur),p=pct(cur),nt=nextTask();
 var h='<div class="card hero">'+ring("day",p,c[0]+"/"+c[1],"مهمة مكتملة · "+p+"%",132)+'<div class="nx">'+(nt?'<small>🎯 مهمتك الجاية</small><div class="nt">'+esc(nt.k.t)+'</div><button class="p big" data-a="tg" data-t="'+nt.k.id+'">✓ خلّصتها</button>':'<div class="nt">🎉 خلّصت كل مهام اليوم!</div>')+'</div></div>';
 var m='';D.sections.forEach(function(s){m+=secH(s)});
 if(edit)m+='<div class="row"><button class="p" data-a="addSec">+ محور جديد</button></div>';
 return h+'<div class="jg"><div>'+m+'</div>'+qH(true)+'</div>'}
function secH(s){var c=cnt(s,cur),p=c[1]?Math.round(c[0]/c[1]*100):0,o=D.open[s.id]!==false,l=L(cur);
 var h='<div class="card'+(c[1]&&p===100?' full':'')+'"><div class="sh" data-a="tgs" data-s="'+s.id+'"><span class="ar">'+(o?"▾":"◂")+'</span><b>'+esc(s.name)+'</b><span class="chip">'+c[0]+'/'+c[1]+' · '+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div>';
 if(o){
  if(edit)h+='<div class="row"><button class="sm" data-a="renSec" data-s="'+s.id+'">✎ اسم المحور</button><button class="sm dg" data-a="delSec" data-s="'+s.id+'">✕ حذف المحور</button></div>';
  s.groups.forEach(function(g){
   h+='<div class="g"><h3>'+esc(g.name)+(g.by>0&&g.by<24?' <small>⏰ قبل '+g.by+':00</small>':'');
   if(edit)h+='<button class="sm" data-a="addT" data-g="'+g.id+'">+ مهمة</button><button class="sm" data-a="by" data-g="'+g.id+'">⏰</button><button class="sm" data-a="renG" data-g="'+g.id+'">✎</button><button class="sm dg" data-a="delG" data-g="'+g.id+'">✕</button>';
   h+='</h3>';
   g.tasks.forEach(function(k){var d=l.d[k.id],lt=!d&&late(g),st=streak(k.id);
    h+='<div class="t'+(d?" dn":"")+(k.pr?" pr":"")+(lt?" lt":"")+'"><button class="ck'+(d?" d":"")+(pop===k.id?" pop":"")+'" data-a="tg" data-t="'+k.id+'">'+(d?"✓":"")+'</button><span class="x">'+esc(k.t)+'</span>'+(lt?'<span class="tag">متأخرة</span>':'')+(st?'<span class="st">🔥'+st+'</span>':'')+'<button class="star'+(k.pr?" on":"")+'" data-a="pr" data-t="'+k.id+'">★</button>';
    if(edit)h+='<button class="sm" data-a="renT" data-t="'+k.id+'">✎</button><button class="sm dg" data-a="delT" data-t="'+k.id+'">✕</button>';
    h+='</div>'});
   h+='</div>'});
  if(edit)h+='<div class="row"><button class="sm" data-a="addG" data-s="'+s.id+'">+ فترة / مجموعة</button></div>';
  h+='<textarea data-n="'+s.id+'" placeholder="ملاحظات اليوم…">'+esc(l.n[s.id]||"")+'</textarea>'}
 return h+'</div>'}

var QS=["نحن نعمل وبالله التوفيق، ونحن نعمل وعلى الله التحقيق","دوس بنزين وسيبها على الزعيم","حق الزعيم أن يرانا كما يريد","الموازنة بعدالة ونظام بين مسؤوليات قضيته ومسؤوليات معيشته","حيوية مرنة في إمكاناته الذاتية"];
function qi(){if(D.qi==null)return Math.floor(Date.now()/864e5)%D.q.length;return D.qi%D.q.length}
function qH(full){var q=D.q,i=qi();
 var h='<aside><div class="card qc"><small>✨ مبادئي</small><div class="qf" data-a="qn">“'+esc(q[i])+'”</div><small>اضغط على المقولة لتغييرها</small>';
 if(full){h+='<div class="ql'+(edit?" ed":"")+'">'+q.map(function(x,j){return'<div class="qi'+(j===i?" a":"")+'"><span>'+esc(x)+'</span>'+(edit?'<button class="sm" data-a="renQ" data-i="'+j+'">✎</button><button class="sm dg" data-a="delQ" data-i="'+j+'">✕</button>':'')+'</div>'}).join("")+'</div>';
  if(edit)h+='<button class="sm" data-a="addQ" style="margin-top:8px">+ مقولة</button>'}
 return h+'</div></aside>'}
function runMin(){var t=D.timer;return t&&t.date===cur&&t.phase!=="break"?Math.floor((Date.now()-t.start)/60000):0}
function totalMin(){return L(cur).w+runMin()}
function tmText(){var t=D.timer;if(!t){return D.mode==="free"?"0:00":fmtS(parseInt(D.mode,10)*60)}
 var el=Math.floor((Date.now()-t.start)/1000);return t.mode==="free"?fmtS(el):fmtS((t.phase==="focus"?t.f:t.b)*60-el)}
function wH(){var l=L(cur),m=totalMin(),mn=D.target[0],mx=D.target[1],t=D.timer,p=Math.min(100,Math.round(m/mn*100));
 var msg=m>=mx?"وصلت للحد الأعلى 👏":m>=mn?"حققت الهدف الأدنى ✅":"باقي "+fmt(mn-m)+" للهدف الأدنى";
 var h='<div class="card hero">'+ring("w",p,fmt(m),"ساعة اليوم",132,"wbig")+'<div class="nx"><b>'+msg+'</b><div class="mu">الهدف من '+fmt(mn)+' إلى '+fmt(mx)+' ساعة</div><button class="sm" data-a="wt" style="margin-top:8px">🎯 تعديل الهدف</button></div></div>';
 h+='<div class="card"><div class="row c">'+[["free","حر"],["25","25 + 5"],["50","50 + 10"]].map(function(x){return'<button class="'+(D.mode===x[0]?"on":"")+'" data-a="mode" data-m="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>';
 h+='<div class="tm" id="tm">'+tmText()+'</div><div class="mu" style="text-align:center">'+(t?(t.phase==="break"?"☕ استراحة":"🎯 تركيز"+(t.label?" · "+esc(t.label):"")):"جاهز؟ اختار الوضع وابدأ")+'</div>';
 if(!t)h+='<input id="lb" placeholder="بشتغل على إيه؟ (اختياري)" style="margin-top:10px">';
 h+='<button class="p big" data-a="wst">'+(t?"⏹ إيقاف وحفظ":"▶ ابدأ")+'</button><div class="row c"><button data-a="wa" data-n="15">+15د</button><button data-a="wa" data-n="30">+30د</button><button data-a="wa" data-n="-15">−15د</button></div></div>';
 h+=qH(false);h+='<div class="card"><b>جلسات اليوم</b>';
 var s=l.s||[];if(!s.length)h+='<div class="mu">لسه مفيش جلسات.</div>';
 s.forEach(function(x,i){h+='<div class="ses"><span>'+(x.l?esc(x.l):"جلسة عمل")+'</span><small>'+new Date(x.t).toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"})+'</small><b>'+x.m+' د</b><button class="sm dg" data-a="ds" data-i="'+i+'">✕</button></div>'});
 return h+'</div>'}

function sH(){var today=ds(new Date()),base=addDays(today,off*7),days=[],i,sum=0,wm=0,hit=0;
 for(i=6;i>=0;i--)days.push(addDays(base,-i));
 var cols=days.map(function(d){var p=pct(d),c=dayCnt(d),w=D.log[d]?D.log[d].w:0;sum+=p;wm+=w;if(w>=D.target[0])hit++;
  return'<div class="col'+(d===today?" cur":"")+'"><small>'+p+'%</small><div class="cb"><i style="height:'+p+'%"></i></div><b>'+new Date(d+"T12:00:00").toLocaleDateString("ar-EG",{weekday:"short"})+'</b><small>'+c[0]+'/'+c[1]+'</small><small>⏱ '+fmt(w)+'</small></div>'}).join("");
 var rng=new Date(days[0]+"T12:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"short"})+" – "+new Date(days[6]+"T12:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"short"});
 var h='<div class="card"><div class="hd"><b>📊 إنجاز الأسبوع</b><div class="nav"><button data-a="wk" data-n="1"'+(off>=0?" disabled":"")+'>›</button><small>'+rng+'</small><button data-a="wk" data-n="-1">‹</button></div></div><div class="cols">'+cols+'</div>';
 h+='<div class="tiles"><div><b>'+Math.round(sum/7)+'%</b><small>متوسط الإنجاز</small></div><div><b>'+fmt(wm)+'</b><small>ساعات العمل</small></div><div><b>'+hit+'/7</b><small>أيام حققت هدف العمل</small></div></div></div>';
 h+='<div class="card"><b>حسب المحور</b>'+D.sections.map(function(s){var a=days.reduce(function(x,d){var c=cnt(s,d);return x+(c[1]?c[0]/c[1]*100:0)},0)/7;a=Math.round(a);return'<div class="sb"><span>'+esc(s.name)+'</span><div class="bar"><i style="width:'+a+'%"></i></div><em>'+a+'%</em></div>'}).join("")+'</div>';
 return h}

function render(){var today=ds(new Date());
 document.getElementById("dn").style.display=pg==="s"?"none":"flex";
 document.getElementById("dl").textContent=cur===today?"اليوم":new Date(cur+"T12:00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
 var eb=document.getElementById("eb");eb.style.display=pg==="j"?"":"none";eb.className=edit?"on":"";
 document.getElementById("sb").textContent=D.snd?"🔊":"🔇";
 document.querySelectorAll("#nv button").forEach(function(b){b.className=b.dataset.p===pg?"on":""});
 document.getElementById("app").innerHTML=pg==="j"?jH():pg==="w"?wH():sH();
 requestAnimationFrame(function(){document.querySelectorAll(".rg").forEach(function(c){c.style.strokeDashoffset=c.dataset.o})});pop=null}

/* modal */
function modal(title,html,cb){var md=document.getElementById("md");document.getElementById("mt").textContent=title;document.getElementById("mb").innerHTML=html;document.getElementById("ok").textContent="حسناً";md.style.display="flex";
 var f=document.getElementById("mi");if(f)f.focus();
 document.getElementById("ok").onclick=function(){var v=f?f.value:null;md.style.display="none";cb(v)};
 document.getElementById("no").onclick=function(){md.style.display="none"}}
function ask(t,v,cb){modal(t,'<input id="mi" value="'+esc(v==null?"":v)+'">',function(x){x=(x||"").trim();if(x)cb(x)})}
function sure(t,cb){modal(t,"",cb)}

/* timer */
function addSes(d,m,lb){if(m<1)return;var l=L(d);l.w+=m;l.s.push({m:m,l:lb||"",t:Date.now()})}
function stopT(){var t=D.timer;if(!t)return;if(t.phase!=="break")addSes(t.date,Math.round((Date.now()-t.start)/60000),t.label);D.timer=null;save()}
function tick(){var t=D.timer;if(!t)return;
 if(t.mode!=="free"){var len=(t.phase==="focus"?t.f:t.b)*60,el=(Date.now()-t.start)/1000;
  if(el>=len){snd("chime");if(t.phase==="focus"){addSes(t.date,t.f,t.label);boom(25);t.phase="break";t.start=Date.now()}else D.timer=null;save();if(pg==="w")render();return}}
 if(pg==="w"){var e=document.getElementById("tm");if(e)e.textContent=tmText();var m=totalMin(),b=document.getElementById("wbig"),r=document.querySelector(".rg");if(b)b.textContent=fmt(m);if(r)r.style.strokeDashoffset=326.7*(1-Math.min(100,m/D.target[0]*100)/100)}}

document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 var a=b.dataset.a,t=b.dataset.t,f=t?findT(t):null,gg=b.dataset.g?findG(b.dataset.g):null,s=b.dataset.s?sec(b.dataset.s):null;
 if(a==="prev")cur=addDays(cur,-1);
 else if(a==="next")cur=addDays(cur,1);
 else if(a==="today")cur=ds(new Date());
 else if(a==="pg"){pg=b.dataset.p;if(pg!=="j")edit=false;if(pg==="s")off=0}
 else if(a==="wk")off=Math.min(0,off+parseInt(b.dataset.n,10));
 else if(a==="edit")edit=!edit;
 else if(a==="snd"){D.snd=!D.snd;save();snd("tick")}
 else if(a==="tgs")D.open[s.id]=!(D.open[s.id]!==false),save();
 else if(a==="tg"){var l=L(cur),c0=cnt(f.s,cur),p0=pct(cur);
  if(l.d[t]){delete l.d[t];snd("undo")}else{l.d[t]=1;pop=t;snd("tick");
   var c1=cnt(f.s,cur),p1=pct(cur);
   if(p1===100&&p0<100){boom(70);snd("win")}else if(c1[0]===c1[1]&&c0[0]<c0[1]){boom(30);snd("done")}}
  save()}
 else if(a==="pr"){f.k.pr=!f.k.pr;save()}
 else if(a==="addT"){ask("اسم المهمة الجديدة","",function(v){gg.g.tasks.push(T(uid(),v));save();render()});return}
 else if(a==="renT"){ask("تعديل المهمة",f.k.t,function(v){f.k.t=v;save();render()});return}
 else if(a==="delT"){sure("حذف المهمة؟",function(){f.g.tasks=f.g.tasks.filter(function(x){return x.id!==t});save();render()});return}
 else if(a==="addG"){ask("اسم الفترة / المجموعة","",function(v){s.groups.push({id:uid(),by:24,name:v,tasks:[]});save();render()});return}
 else if(a==="renG"){ask("تعديل الاسم",gg.g.name,function(v){gg.g.name=v;save();render()});return}
 else if(a==="by"){ask("الموعد النهائي (ساعة من 1 إلى 23، و 24 = بدون موعد)",gg.g.by,function(v){var x=parseInt(v,10);if(x>=0&&x<=24)gg.g.by=x;save();render()});return}
 else if(a==="delG"){sure("حذف المجموعة بكل مهامها؟",function(){gg.s.groups=gg.s.groups.filter(function(x){return x.id!==gg.g.id});save();render()});return}
 else if(a==="renSec"){ask("اسم المحور",s.name,function(v){s.name=v;save();render()});return}
 else if(a==="delSec"){sure("حذف المحور بالكامل؟",function(){D.sections=D.sections.filter(function(x){return x.id!==s.id});save();render()});return}
 else if(a==="addSec"){ask("اسم المحور الجديد","",function(v){D.sections.push({id:uid(),name:v,type:"list",groups:[{id:uid(),by:24,name:"المهام",tasks:[]}]});save();render()});return}
 else if(a==="mode"){if(!D.timer){D.mode=b.dataset.m;save()}}
 else if(a==="wst"){snd("tick");if(D.timer)stopT();else{var lb=document.getElementById("lb"),m=D.mode;D.timer={start:Date.now(),date:cur,mode:m==="free"?"free":"pomo",f:m==="50"?50:25,b:m==="50"?10:5,phase:"focus",label:lb?lb.value.trim():""};save()}}
 else if(a==="wa"){var l2=L(cur);l2.w=Math.max(0,l2.w+parseInt(b.dataset.n,10));save()}
 else if(a==="ds"){var l3=L(cur),i=parseInt(b.dataset.i,10);l3.w=Math.max(0,l3.w-l3.s[i].m);l3.s.splice(i,1);save()}
 else if(a==="qn"){D.qi=(qi()+1)%D.q.length;save()}
 else if(a==="renQ"){var i2=parseInt(b.dataset.i,10);ask("تعديل المقولة",D.q[i2],function(v){D.q[i2]=v;save();render()});return}
 else if(a==="delQ"){var i3=parseInt(b.dataset.i,10);sure("حذف المقولة؟",function(){if(D.q.length>1){D.q.splice(i3,1);D.qi=0;save();render()}});return}
 else if(a==="addQ"){ask("المقولة الجديدة","",function(v){D.q.push(v);save();render()});return}
 else if(a==="wt"){ask("الحد الأدنى (بالساعات)",D.target[0]/60,function(v){var x=parseFloat(v);if(x>0)ask("الحد الأعلى (بالساعات)",D.target[1]/60,function(v2){var y=parseFloat(v2);D.target=[Math.round(x*60),Math.round(Math.max(x,y)*60)];save();render()})});return}
 render()});
document.addEventListener("input",function(e){var n=e.target.dataset&&e.target.dataset.n;if(n){L(cur).n[n]=e.target.value;save()}});
setInterval(tick,1000);
load();cur=ds(new Date());render();tick();
